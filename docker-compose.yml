version: "3.9"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://jjclothing:jjclothing@db:3306/jjclothing"
      JWT_SECRET: "change-this-to-a-long-random-string"
      JWT_REFRESH_SECRET: "change-this-to-a-different-long-random-string"
      CRON_SECRET: "change-this-to-a-long-random-string"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_NAME: "JJ Clothing"
      RESEND_API_KEY: ""
      EMAIL_FROM: ""
      AFFILIATE_COMMISSION_PERCENT: "10"
    depends_on:
      - db
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: jjclothing
      MYSQL_USER: jjclothing
      MYSQL_PASSWORD: jjclothing
      MYSQL_ROOT_PASSWORD: change-this-root-password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
