<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #F7F4EF;
    display: flex; align-items: center; justify-content: center;
  }
  .lockup {
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }
  .mark {
    width: 220px; height: 220px;
    border-radius: 50%;
    background: #1C1B19;
    display: flex; align-items: center; justify-content: center;
  }
  .mark span {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    color: #F7F4EF;
    font-size: 92px;
    letter-spacing: 0.02em;
  }
  .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    color: #1C1B19;
    font-size: 64px;
    letter-spacing: 0.01em;
  }
  .tagline {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 600;
    color: #B8365E;
    font-size: 20px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="lockup">
    <div class="mark"><span>W</span></div>
    <div class="name">Warechhiya</div>
    <div class="tagline">Dress Your Story</div>
  </div>
</body>
</html>
