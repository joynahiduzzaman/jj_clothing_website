<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #F7F4EF;
    display: flex; align-items: center; justify-content: center;
  }
  .mark {
    width: 82%; height: 82%;
    border-radius: 50%;
    background: #1C1B19;
    display: flex; align-items: center; justify-content: center;
  }
  .mark span {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    color: #F7F4EF;
    font-size: 42%;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="mark"><span>JJ</span></div>
</body>
</html>
